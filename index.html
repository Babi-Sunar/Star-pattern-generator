<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn_star_patterns</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- header -->
    <header>
        <div id="header">
            <span class="header_text"> LEARN STAR PATTERNS </span>
        </div>
    </header>

    <section id="main">


        <!-- star lists -->
        <section id="star_lists">
            <ul class="patterns_type">
                <li><button onclick= "square()" title="click for square">Square</button></li>
                <li><button onclick="ra_triangle()" title="click of RA-triangle">Right angle triangle</button></li>
                <li><button onclick="ira_triangle()" title="click for IRA-triangle">Inverted-right angle triangle</button></li>
                <li><button onclick="lra_triangle()" title="click for Left RA triangle">Left right angle triangle</button></li>
                <li><button onclick="ilra_triangle()" title="click for ILRA triangle">Inverted-left right angle triangle</button></li>
                <li><button onclick="pyramid()" title="click for pyramid">Pyramid</button></li>
                <li><button onclick="i_pyramid()" title="click for inverted pyramid">inverted-pyramid</button></li>
                <li><button onclick="diamond()" title="click for diamond">Diamond</button></li>
                <li><button onclick="hourglass()" title="click for hourglass">Hourglass</button></li>
                <li><button onclick="hollow_square()" title="click for hollow square">Hollow-square</button></li>
                <li><button onclick="hollow_triangle()" title="click for hollow triangle">Hollow-triangle</button></li>
                <li><button onclick="hollow_diamond()"  title="click for hollow diamond">Hollow-diamond</button></li>
                <li><button onclick="num_pyramid()" title="click for number pyramid">Numbered pyramid</button></li>
                <li><button onclick="star_with_space()" title="click for stars with space">Star with Space (mixed)</button></li>
            </ul>
        </section>


        <!-- star results -->
        <section id="star_results">
            <div class="pattern_result" id="pattern"> Pattern here..</div>
            <div class="code_result" id="code">Code here..</div>
        </section>
    </section>


    <!-- footer -->
    <footer>
        <div id="beSimple"><span>BeSimple Codes !</span></div>
    </footer>

    <!-- js script -->
    <script src="index.js"></script>
</body>

</html>
